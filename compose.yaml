services:
  app:
    image: golpakhsh-ats:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the server environment or .env file}
      SHAREPOINT_JOBS_URL: ${SHAREPOINT_JOBS_URL:-}
      SHAREPOINT_USERNAME: ${SHAREPOINT_USERNAME:-}
      SHAREPOINT_PASSWORD: ${SHAREPOINT_PASSWORD:-}
      SHAREPOINT_AUTH: ${SHAREPOINT_AUTH:-ntlm}
      SHAREPOINT_SITE_URL: ${SHAREPOINT_SITE_URL:-http://gpasharepoint/sites/hrm}
      SHAREPOINT_WRITES_ENABLED: ${SHAREPOINT_WRITES_ENABLED:-false}
    volumes:
      - ats-data:/app/data

volumes:
  ats-data:
    name: golpakhsh-ats-data
